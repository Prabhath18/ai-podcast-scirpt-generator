<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Podcast Outline AI: plan an episode, compare structures, research sources, and export a production script."
    />
    <title>Podcast Outline AI</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Applied before paint so a dark-theme user never sees a light flash.
      (function () {
        try {
          const stored = localStorage.getItem('podcast-theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = stored || (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch {
          /* localStorage unavailable -- default to light, no crash */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
